<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <!-- Responsive design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      const redirectPath = new URLSearchParams(window.location.search).get("redirect");
      if (redirectPath?.startsWith("/") && !redirectPath.startsWith("//")) {
        window.history.replaceState(null, "", redirectPath);
      }
    </script>
    <!-- portrait-image-preload -->

    <!-- Browser theme -->
    <meta name="theme-color" content="#f8f5f1" />
    <meta name="color-scheme" content="light" />

    <!-- Locally hosted fonts used in the header and page content -->
    <link
      rel="preload"
      href="/fonts/cormorant-garamond-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/jost-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- SEO -->
    <meta name="description" content="MUA Fanny – Fanny Ehrnholm, professionell make-up artist och hårstylist. Upptäck tjänster inom make-up, hårstyling och bröllopsstyling." />
    <meta name="robots" content="index, follow" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />

    <!-- Apple / iPhone -->
    <link rel="apple-touch-icon"  href="/favicon.png?v=2" />
    <meta name="apple-mobile-web-app-title" content="MUA Fanny" />

    <!-- Social media sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Fanny Ehrnholm | Make-up artist & hårstylist - MUA Fanny" />
    <meta property="og:description" content="Fanny Ehrnholm, professionell make-up artist och hårstylist. Upptäck tjänster inom make-up, hårstyling och bröllop." />
    <meta property="og:image" content="https://muafanny.se/social-share.png" />
    <meta property="og:url" content="https://muafanny.se/" />
    <meta property="og:locale" content="sv_SE" />

    <title>Fanny Ehrnholm | Make-up artist & hårstylist - MUA Fanny</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
